# =============================================================================
# pnpm 工作区与构建脚本白名单
# 作用：
# 1. 明确当前目录为 pnpm 工作区根目录。
# 2. pnpm 10+ 默认拦截依赖的 postinstall 脚本；esbuild 与 vue-demi 需要执行
#    构建脚本来准备本地二进制/适配文件。这里按最小范围显式放行。
# 3. allowBuilds 是 pnpm 11 的配置格式；Docker 镜像固定使用同一主版本。
# =============================================================================
packages:
  - .

allowBuilds:
  esbuild: true
  vue-demi: true
